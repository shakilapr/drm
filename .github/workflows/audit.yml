# Nightly audits — codebase.md §5.2 (audit.yml).
# Placeholder jobs disabled until the toolchain lands (W3).
name: audit

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  deny:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  zero-alloc:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask audit-zero-alloc

  traceability:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask audit-traceability

  gen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase 0: the fixture generates, caches, verifies itself, and exchanges data
      # between two independently built applications. A vacuous fixture fails.
      - run: cargo xtask integration --check
      - run: cargo xtask gen-check
      # The repo-root TypeScript surface declares no DRM packages, so it is checked
      # on its own rather than as a vacuous DRM pass.
      - run: cargo xtask gen-check --workspace . --ts-only

  docs-examples:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask docs

  benchmarks:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask bench --report-regressions
