# Merge gate - codebase.md 5.2 (ci.yml).
# Frontend and docs jobs stay disabled (`if: false`) until their trees land.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # honors rust-toolchain.toml
      - uses: mozilla/sccache-action@v0.0.11
      - name: sccache setup
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: fmt
        run: cargo xtask fmt --check
      - name: lint
        run: cargo xtask lint
      - name: test
        run: cargo xtask test
      - name: layering
        run: cargo xtask check-layering
      - name: traceability
        run: cargo xtask audit-traceability --registry

  windows-smoke:
    # Windows conformance manifest (work-plan M12W4-E4-T3, extended M13W1-E1/E3,
    # full port M13W3, crash matrix M13W4; windows-backends.md §Test Matrix):
    # the same manifest the nightly job runs — section create/map round-trip,
    # precommit refusal, lock acquire/release, kernel release-on-death,
    # incarnation guard, active-hold lifecycle, guarded cleanup, platform
    # lifecycle parity, Windows publisher/consumer lifecycle (in-place `Init`
    # reinit, restart epoch parity), the publisher crash matrix (kill/restart
    # ×50), reader-kill reclamation, link-cut isolation, the bounded serial
    # codec, socket transports, router framing/lanes/shaping, toolchain
    # verify/budget/determinism, and the bindings golden/FFI rows (scheduled on
    # the port board). Platform-only suites are cfg(unix); the manifest is the
    # blocking Windows platform gate. One list, never a fork
    # (xtask/src/cross_os.rs).
    # REQ: REQ-QAL-008, REQ-CORE-054, REQ-CORE-056, REQ-CORE-057, REQ-CORE-074,
    # REQ-CORE-075, REQ-CORE-076, REQ-CORE-077, REQ-CORE-078, REQ-CORE-101,
    # REQ-ROUTE-007, REQ-ROUTE-025, REQ-ROUTE-026.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # honors rust-toolchain.toml
      - name: cross-OS conformance manifest
        run: cargo xtask test --cross-os
      - name: cross-OS full conformance run ×2 (run 2 must be green)
        run: cargo xtask test --cross-os --full

  interop-cells:
    # Cross-OS interop matrix (work-plan M13W2-E4-T1, full matrix M14W1-E4-T1,
    # Phase 31): the {publisher_os, consumer_os} × {C, C++, Rust, Python} ×
    # {udp, tcp, serial(host-loopback)} cells run over loopback on this host
    # (the documented two-netns simulation fallback when a second host is
    # unavailable); per-cell evidence is archived under target/interop/ and the
    # full cell table report under target/interop/matrix-report.txt. The 24
    # same-language cells are gate-blocking; mixed-language cells are tracked.
    # Windows↔Linux cells re-run on the physical dual-VM/lab runner in the M14
    # matrix. One matrix, never a fork (xtask/src/cross_os.rs interop_matrix).
    # REQ: REQ-QAL-008, REQ-OPS-004, REQ-ROUTE-029, REQ-ROUTE-032.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # honors rust-toolchain.toml
      - name: interop UDP cells
        run: cargo xtask test --cross-os --transport udp
      - name: interop TCP cells
        run: cargo xtask test --cross-os --transport tcp
      - name: interop serial cells (host-loopback)
        run: cargo xtask test --cross-os --transport serial

  corpus:
    # Blocking parser-corpus matrix (work-plan M01W3-E4-T1): counts must print
    # 30/30 valid + 30/30 invalid in the log. REQ: REQ-TOOL-001.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: corpus matrix
        run: cargo test -p drm-workspace --test fixtures_valid --test parser_corpus -- --nocapture

  toolchain:
    # Static verify engine + dev watch suite (work-plan M09W2-E2-T1/T2,
    # M09W3-E2-T2/T3, E4-T2): verify negatives v1/v2, I-BO2..I-BO4, and the
    # scripted dev-mode smoke stay green blocking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: verify engine
        run: cargo test -p drm-workspace --test verify_engine
      - name: verify negatives v2
        run: cargo test -p drm-workspace --test verify_negatives_v2
      - name: dev watch suite
        run: cargo test -p drm-workspace --test watch_dispatch
      - name: dev-mode smoke
        run: cargo test -p drm-cli --test dev_smoke

  mcu:
    # MCU host parity + zero-forbidden-heap audit, wired as a permanent blocking
    # gate on every PR/push (regression permanence, AGENTS #14; work-plan
    # M17W1-E3-T1). Cross-compilation against the pinned Arm toolchain stays in
    # mcu-cross.yml; this job keeps the in-session-green host suites required.
    # REQ: REQ-CORE-087, REQ-OPS-004.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host parity self-test
        run: make -C bindings/c/mcu host-test
      - name: zero-forbidden-heap symbol audit
        run: make -C bindings/c/mcu host-audit

  conformance:
    # Golden primitive parity across decoders (tests/conformance/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rust canon reader
        run: cargo test -p drm-core --test golden_primitives
      - name: C11 independent reader
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -o golden_read bindings/c/tests/golden/golden_read.c
          ./golden_read tests/fixtures/golden/primitives
      - name: C11 two-region composite reader
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -o golden_composites bindings/c/tests/golden/golden_composites.c
          ./golden_composites tests/fixtures/golden/composites
      - name: Python struct reader (prims + composites)
        run: |
          pip install pytest ruff mypy
          python -m pytest bindings/python/tests/test_golden_bytes.py
          python -m ruff check bindings/python
          python -m mypy --strict bindings/python/tests/test_golden_bytes.py
      - name: ABI spike (gcc+clang x c99+c11, syntax + probes)
        run: |
          for cc in gcc clang; do
            for std in c99 c11; do
              $cc -std=$std -Wall -Wextra -Wpedantic -Werror -Ibindings/c/include \
                -o abi_spike bindings/c/tests/abi/abi_spike.c
              ./abi_spike
            done
          done

  fuzz-pr:
    # 2-minute libFuzzer smoke per PR (work-plan M01W3-E4-T2); full budget in
    # fuzz-nightly.yml. Linux-only: libFuzzer does not build on MSVC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: fuzz smoke (schema, 120s)
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run --fuzz-dir tests/fuzz schema -- -max_total_time=120 -timeout=5
      - name: fuzz smoke (datagram, 120s)
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run --fuzz-dir tests/fuzz datagram -- -max_total_time=120 -timeout=5

  frontend:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm build

  docs:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask docs
