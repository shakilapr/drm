# Nightly deep fuzz + chaos (work-plan M18W1-E4-T1): every live libFuzzer target
# gets a 1-hour budget, and the chaos suites (kill matrix, PID reuse,
# exhaustion storms, link storms) run under an extended iteration budget. New
# target types graduate to permanent PR gates only when two consecutive nightly
# runs find no issues (codebase.md 4.1). Triage: docs/spec/fuzz-triage-board.md.
name: fuzz-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    # FUZZ_TARGETS_LIVE = 5/5 core targets + the verify-fixture target, nightly.
    strategy:
      fail-fast: false
      matrix:
        target: [schema, framing, datagram, hazard, serial, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: ${{ matrix.target }} (3600s)
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: >-
          cargo fuzz run --fuzz-dir tests/fuzz ${{ matrix.target }}
          -- -max_total_time=3600 -timeout=5

  chaos:
    # CHAOS_GREEN: kill matrix + PID reuse + exhaustion storms + link storms
    # recover every time (work-plan M18W1-E1-T2/E3-T2).
    runs-on: ubuntu-latest
    env:
      DRM_STRESS_ITERS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: channel kill matrix + PID reuse + exhaustion storms
        run: >-
          cargo test --release -p drm-core --test stress
          -- --ignored stress_chaos --nocapture
      - name: process/segment SIGKILL stages
        run: >-
          cargo test --release -p drm-core --test shm_kill
          -- --ignored stress_shm_kill --nocapture
      - name: link storms + session flapping
        run: >-
          cargo test --release -p drm-router --test link_storm
          -- --ignored stress_link_storm --nocapture

  udp-pair:
    # Nightly loopback matrix (work-plan M10W1-E4-T2): the UDP pair example runs
    # repeated full exchanges to surface a rare reorder/loss flake (I-RT9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: UDP loopback pair (x3)
        run: |
          for run in 1 2 3; do
            echo "udp_pair run $run"
            cargo run --release -p drm-router --example udp_pair
          done

  two-host:
    # Nightly two-host router/transport matrix (work-plan M10W2-E4-T1; extended
    # M10W3-E4-T1): two router instances as distinct hosts exchange every topic
    # class over loopback, plus the route-derivation ↔ router-filtering e2e.
    # REQ: REQ-QAL-008, REQ-ROUTE-022, REQ-ROUTE-031, REQ-ROUTE-032.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: two-host sim (x3)
        run: |
          for run in 1 2 3; do
            echo "two-host run $run"
            cargo xtask test --two-host
          done

  stress:
    runs-on: ubuntu-latest
    env:
      DRM_STRESS_CYCLES: "100000000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: structured billion-cycle stress (1e8 CI budget)
        run: |
          cargo test --release -p drm-core --test stress_structured_billions \
            -- --ignored --nocapture | tee stress-structured.log
      - name: ring depth sweep (extended property)
        run: |
          cargo test --release -p drm-core --lib -- --ignored stress --nocapture \
            | tee -a stress-structured.log
      - uses: actions/upload-artifact@v4
        with:
          name: stress-structured
          path: stress-structured.log
