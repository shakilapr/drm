# Sanitizer suite (work-plan M01W3-E1-T1b).
#
# ASan over the platform conformance suite (Linux-only, cfg(unix)) with
# ASAN_OPTIONS=abort_on_error=1, plus Miri on the pure-safe test set. The
# shm platform suite must stay syscall-clean: no raw syscalls, no
# mmap-adjacent tricks (SHM-03; P8 spec forbids raw-syscall mmaps), so Miri
# and ASan can co-exist on the same sources.
#
# Cross-process note (TSan): shm_ring/hazard suites exercise cross-process
# ordering that TSan cannot model (no TSan-instrumented fork model);
# concurrency coverage rides the rmw hazard tests + Miri + the PR fuzz gate
# instead. Revisit when TSan gains a supported fork model.
#
# Blocking when green: this suite graduates to a required check after two
# consecutive green nightly runs, like the fuzz matrix.
name: sanitizers

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

env:
  RUSTFLAGS: "-D warnings"

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "abort_on_error=1:handle_abort=2"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo test --workspace --target x86_64-unknown-linux-gnu
      - name: ASan 0 findings required
        if: failure()
        run: exit 1

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri on pure-safe targets (parser, codec)
        run: |
          cargo +nightly miri test -p drm-core --test canon_le_assert
          cargo +nightly miri test -p drm-workspace --lib

  windows-asan:
    # Windows ASan triage (work-plan M12W2-E1-T2): nightly `-Zsanitizer=address`
    # over the Windows SHM/identity/locks suites. Scheduled only; a finding is a
    # triage item (carry-over allowed to M12W3 Day 1 per the week's risk
    # register). REQ: REQ-CORE-075, REQ-CORE-078.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: ASan over drm-core Windows suite
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "abort_on_error=1"
        run: >
          cargo +nightly test -Zbuild-std
          --target x86_64-pc-windows-msvc
          -p drm-core --lib win_
