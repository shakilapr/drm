# Nightly Windows conformance subset (work-plan M12W2-E4-T2, M12W4-E4-T1,
# extended M13W1-E1/E3/E4): the cross-OS subset defined in
# xtask/src/cross_os.rs — SHM sections, process identity, `LockFileEx` locks,
# Windows publisher/consumer lifecycle (in-place `Init` reinit, restart epoch
# parity), the bounded serial codec, socket transports, router
# framing/lanes/shaping, and the verify engine. Runs three consecutive times so
# runner flakiness surfaces (work-plan M12W4 Tests: green ×3 consecutive).
# Results feed docs/metrics/metrics-m12.md, docs/metrics/metrics-m13.md, and
# docs/gates/month-12.md.
# REQ: REQ-QAL-008, REQ-CORE-074, REQ-CORE-075, REQ-CORE-076, REQ-CORE-077,
# REQ-CORE-078, REQ-CORE-101, REQ-ROUTE-025, REQ-ROUTE-026, REQ-ROUTE-029,
# REQ-ROUTE-032.
name: windows-nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  windows-platform:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # honors rust-toolchain.toml
      - name: cross-OS conformance subset (green ×3 consecutive)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "::group::subset run $i"
            cargo xtask test --cross-os
            echo "::endgroup::"
          done
