[project]
name = "drm-bindings-python"
version = "0.1.0"
description = "DRM Python test scaffolding: golden byte decoder conformance (pytest + struct)."
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["tests"]
