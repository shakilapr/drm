[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "drm"
version = "0.1.0"
description = "DRM Python binding: PyO3 native core + owned-read-only facade."
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[tool.maturin]
# Native core crate (workspace member `drm-python`); the pure facade lives in
# `drm/`. `module-name` places the extension at `drm._native`.
manifest-path = "native/Cargo.toml"
python-source = "."
module-name = "drm._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["tests", "drm"]
