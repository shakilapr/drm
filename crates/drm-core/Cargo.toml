[package]
name = "drm-core"
description = "Runtime core: SHM backends, channels, rings, hazard pools, epochs, precommit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
drm-types = { path = "../drm-types" }
thiserror.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.178"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[features]
test-count-allocs = []

[lints]
workspace = true

[[test]]
name = "alloc_counter"
harness = false
required-features = ["test-count-allocs"]

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "codec"
harness = false
