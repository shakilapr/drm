[package]
name = "drm-workspace"
description = "Toolchain: parser, WorkspaceModel, verifier, codegen, topology."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
drm-types = { path = "../drm-types" }
toml.workspace = true
# Deployment-identity minting (CSPRNG) for `deploy::generate`; toolchain-only, so
# the runtime crates stay free of randomness.
getrandom = "0.3"

[features]
# Phase 33 parser groundwork: spatial field-type keywords + frame-path binding.
# Off by default so the Phase-2 schema corpus is byte-for-byte unaffected
# (spatial-types-design.md §3; work-plan M15W1-E2-T1).
spatial-grammar = []

[dev-dependencies]
proptest.workspace = true
toml.workspace = true
# Test-only oracle for the MCU spatial subset vs the runtime `SE(3)` reference
# (work-plan M21W3-E1/E2). Dev-only: the toolchain layer never depends on the
# runtime crate at build time, so `xtask check-layering` is unaffected.
drm-spatial = { path = "../drm-spatial" }

[lints]
workspace = true
